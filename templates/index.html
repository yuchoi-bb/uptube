<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UpTube - 유튜브 음원 다운로드</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-hover: #22262f;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #ff4d4d;
    --accent-dark: #d93b3b;
    --ok: #34c77b;
    --border: #2a2e37;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 40px 20px; }
  header { text-align: center; margin-bottom: 32px; }
  header h1 { font-size: 2.2rem; letter-spacing: -0.5px; }
  header h1 .up { color: var(--accent); }
  header p { color: var(--muted); margin-top: 8px; font-size: 0.95rem; }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 12px 22px;
    font-size: 1rem;
    font-weight: 600;
    background: none;
    color: var(--muted);
    border: none;
    border-bottom: 2.5px solid transparent;
    cursor: pointer;
    transition: color 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .badge {
    display: inline-block;
    min-width: 20px;
    padding: 1px 6px;
    margin-left: 4px;
    font-size: 0.78rem;
    background: var(--accent);
    color: #fff;
    border-radius: 10px;
    text-align: center;
  }
  .badge[hidden] { display: none; }  /* display 지정이 hidden 속성을 덮지 않도록 */
  body.player-open { padding-bottom: 84px; }  /* 하단 고정 플레이어에 가리지 않게 */

  .search-box { display: flex; gap: 10px; margin-bottom: 28px; }
  .search-box input {
    flex: 1;
    padding: 14px 18px;
    font-size: 1rem;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box button {
    padding: 14px 26px;
    font-size: 1rem;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .search-box button:hover { background: var(--accent-dark); }
  .search-box button:disabled { opacity: 0.6; cursor: wait; }

  .status { text-align: center; color: var(--muted); margin: 24px 0; min-height: 1.4em; }
  .status.error { color: var(--accent); }

  .results { display: flex; flex-direction: column; gap: 14px; }
  .card {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    align-items: center;
    transition: background 0.15s;
  }
  .card:hover { background: var(--card-hover); }
  .thumb-wrap { position: relative; flex-shrink: 0; }
  .thumb-wrap img {
    width: 168px;
    height: 94px;
    object-fit: cover;
    border-radius: 10px;
    background: #000;
    display: block;
  }
  .duration {
    position: absolute;
    right: 6px;
    bottom: 6px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 0.75rem;
    padding: 2px 6px;
    border-radius: 5px;
  }
  .info { flex: 1; min-width: 0; }
  .info .title {
    font-size: 1.02rem;
    font-weight: 600;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .info .meta { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
  .actions {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .dl-btn, .pv-btn {
    padding: 11px 20px;
    font-size: 0.92rem;
    font-weight: 600;
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 128px;
  }
  .dl-btn {
    color: var(--accent);
    border: 1.5px solid var(--accent);
  }
  .dl-btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .dl-btn:disabled { cursor: wait; opacity: 0.75; }
  .dl-btn.done { border-color: var(--ok); color: var(--ok); }
  .pv-btn {
    color: var(--text);
    border: 1.5px solid var(--border);
  }
  .pv-btn:hover { border-color: var(--muted); }
  .pv-btn.playing { border-color: var(--ok); color: var(--ok); }

  .player-row { flex-basis: 100%; }
  .player-row audio { width: 100%; height: 40px; }

  .section-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 26px 0 12px;
    color: var(--text);
  }
  .job-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .job-card .job-title {
    font-weight: 600;
    font-size: 0.98rem;
    margin-bottom: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .job-meta {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 7px;
    flex-wrap: wrap;
  }
  .job-state { font-weight: 600; }
  .job-state.downloading { color: #5aa9ff; }
  .job-state.converting { color: #f0b342; }
  .job-state.retrying { color: #f0b342; }
  .job-state.done { color: var(--ok); }
  .job-state.error { color: var(--accent); }
  .retry-btn {
    margin-top: 10px;
    padding: 8px 18px;
    font-size: 0.87rem;
    font-weight: 600;
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .retry-btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .retry-btn:disabled { opacity: 0.6; cursor: wait; }
  .progress {
    height: 8px;
    background: var(--border);
    border-radius: 5px;
    overflow: hidden;
  }
  .progress > div {
    height: 100%;
    background: linear-gradient(90deg, #5aa9ff, #7cc0ff);
    border-radius: 5px;
    width: 0%;
    transition: width 0.4s ease;
  }
  .progress.indeterminate > div {
    width: 35%;
    animation: slide 1.2s linear infinite;
  }
  @keyframes slide {
    from { margin-left: -35%; }
    to { margin-left: 100%; }
  }
  .job-error { color: var(--accent); font-size: 0.83rem; margin-top: 7px; word-break: break-all; }

  .file-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .file-row .file-name {
    flex: 1;
    min-width: 0;
    font-size: 0.93rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-row .file-meta {
    flex-shrink: 0;
    color: var(--muted);
    font-size: 0.83rem;
    text-align: right;
  }
  .folder-path {
    color: var(--muted);
    font-size: 0.83rem;
    margin-bottom: 14px;
    word-break: break-all;
  }
  .empty-note { color: var(--muted); text-align: center; padding: 20px 0; }

  /* ---- 파일 탐색기 ---- */
  .crumbs {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 0.9rem;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }
  .crumbs .seg { color: var(--text); }
  .crumbs .sep { opacity: 0.5; }
  .crumbs .full { flex-basis: 100%; font-size: 0.78rem; word-break: break-all; }

  .explorer-bar { display: flex; gap: 8px; margin-bottom: 10px; }
  .explorer-bar input, .explorer-bar select {
    padding: 10px 12px;
    font-size: 0.92rem;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: none;
  }
  .explorer-bar input { flex: 1; min-width: 0; }
  .explorer-bar input:focus, .explorer-bar select:focus { border-color: var(--accent); }
  .ghost-btn {
    padding: 10px 14px;
    font-size: 1rem;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 9px;
    cursor: pointer;
  }
  .ghost-btn:hover { border-color: var(--muted); }
  .explorer-summary { color: var(--muted); font-size: 0.85rem; margin-bottom: 10px; }

  .explorer {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--card);
  }
  .ex-head, .ex-row {
    display: grid;
    grid-template-columns: 1fr 100px 150px 132px;
    gap: 10px;
    align-items: center;
    padding: 11px 14px;
  }
  .ex-head {
    background: var(--card-hover);
    border-bottom: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.83rem;
    font-weight: 600;
  }
  .ex-head span[data-sort] { cursor: pointer; user-select: none; }
  .ex-head span[data-sort]:hover { color: var(--text); }
  .ex-head .col-size, .ex-row .col-size,
  .ex-head .col-date, .ex-row .col-date { text-align: right; }
  .ex-row { border-bottom: 1px solid var(--border); font-size: 0.92rem; }
  .ex-row:last-child { border-bottom: none; }
  .ex-row:hover { background: var(--card-hover); }
  .ex-row.playing { background: rgba(52, 199, 123, 0.08); }
  .ex-name { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .ex-name .ico { flex-shrink: 0; opacity: 0.85; }
  .ex-name .txt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ex-row .col-size, .ex-row .col-date { color: var(--muted); font-size: 0.85rem; }
  .col-act { display: flex; gap: 6px; justify-content: flex-end; }
  .icon-btn {
    width: 36px;
    height: 34px;
    font-size: 0.95rem;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .icon-btn:hover { border-color: var(--muted); background: var(--bg); }
  .icon-btn.danger:hover { border-color: var(--accent); color: var(--accent); }

  .sticky-player {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--card);
    border-top: 1px solid var(--border);
    box-shadow: 0 -6px 20px rgba(0,0,0,0.35);
    z-index: 20;
  }
  .sticky-player .sp-title {
    flex: 1;
    min-width: 0;
    font-size: 0.9rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sticky-player audio { height: 38px; max-width: 420px; }
  .sp-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.05rem;
    cursor: pointer;
    padding: 6px 8px;
  }
  .sp-close:hover { color: var(--text); }

  @media (max-width: 760px) {
    /* 좁은 화면: 안드로이드 파일관리자처럼 카드형으로 */
    .ex-head { display: none; }
    .ex-row {
      grid-template-columns: 1fr auto;
      grid-template-areas: "name name" "meta act";
      row-gap: 8px;
      padding: 13px 14px;
    }
    .ex-name { grid-area: name; }
    .ex-row .col-size { grid-area: meta; text-align: left; }
    .ex-row .col-date {
      grid-area: meta;
      text-align: left;
      margin-left: 78px;
    }
    .col-act { grid-area: act; }
    .sticky-player { flex-wrap: wrap; }
    .sticky-player audio { width: 100%; max-width: none; order: 3; }
  }

  @media (max-width: 640px) {
    .card { flex-direction: column; align-items: stretch; }
    .thumb-wrap img { width: 100%; height: auto; aspect-ratio: 16 / 9; }
    .actions { flex-direction: row; }
    .dl-btn, .pv-btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="up">Up</span>Tube</h1>
    <p>유튜브 링크 또는 검색어를 입력하고, 원하는 영상의 음원을 MP3로 받으세요.</p>
  </header>

  <nav class="tabs">
    <button class="tab active" id="tabSearch">검색</button>
    <button class="tab" id="tabDownloads">다운로드<span class="badge" id="dlBadge" hidden>0</span></button>
    <button class="tab" id="tabFiles">파일</button>
  </nav>

  <div id="searchView">
    <form class="search-box" id="searchForm">
      <input id="queryInput" type="text" autocomplete="off"
             placeholder="유튜브 링크 붙여넣기 또는 검색어 입력 (예: 아이유 밤편지)" autofocus>
      <button type="submit" id="searchBtn">검색</button>
    </form>

    <div class="status" id="status"></div>
    <div class="results" id="results"></div>
  </div>

  <div id="downloadsView" hidden>
    <div class="folder-path" id="folderPath"></div>
    <div class="section-title">진행 중 / 최근 작업</div>
    <div id="jobList"><div class="empty-note">진행 중인 다운로드가 없습니다.</div></div>
    <div class="section-title">완료된 파일</div>
    <div id="fileList"><div class="empty-note">저장된 파일이 없습니다.</div></div>
  </div>

  <div id="filesView" hidden>
    <div class="crumbs" id="crumbs"></div>
    <div class="explorer-bar">
      <input id="fileFilter" type="text" autocomplete="off" placeholder="파일 이름 검색">
      <select id="sortSelect">
        <option value="mtime-desc">최신순</option>
        <option value="mtime-asc">오래된순</option>
        <option value="name-asc">이름 ↑</option>
        <option value="name-desc">이름 ↓</option>
        <option value="size-desc">큰 파일순</option>
        <option value="size-asc">작은 파일순</option>
      </select>
      <button id="refreshFiles" class="ghost-btn" title="새로고침">↻</button>
    </div>
    <div class="explorer-summary" id="explorerSummary"></div>

    <div class="explorer">
      <div class="ex-head">
        <span class="col-name" data-sort="name">이름</span>
        <span class="col-size" data-sort="size">크기</span>
        <span class="col-date" data-sort="mtime">수정한 날짜</span>
        <span class="col-act">작업</span>
      </div>
      <div id="explorerList"><div class="empty-note">저장된 파일이 없습니다.</div></div>
    </div>
  </div>
</div>

<div class="sticky-player" id="stickyPlayer" hidden>
  <div class="sp-title" id="spTitle"></div>
  <audio id="spAudio" controls autoplay></audio>
  <button class="sp-close" id="spClose" title="닫기">✕</button>
</div>

<script>
const form = document.getElementById('searchForm');
const input = document.getElementById('queryInput');
const searchBtn = document.getElementById('searchBtn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', isError);
}

function formatDuration(sec) {
  if (sec == null) return '';
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const mm = h ? String(m).padStart(2, '0') : String(m);
  const ss = String(s).padStart(2, '0');
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

function formatViews(n) {
  if (n == null) return '';
  if (n >= 1e8) return `조회수 ${(n / 1e8).toFixed(1)}억회`;
  if (n >= 1e4) return `조회수 ${(n / 1e4).toFixed(1)}만회`;
  return `조회수 ${n.toLocaleString()}회`;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;

  searchBtn.disabled = true;
  resultsEl.innerHTML = '';
  setStatus('검색 중...');
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '검색에 실패했습니다.');
    setStatus(`${data.items.length}개의 결과`);
    data.items.forEach(renderCard);
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    searchBtn.disabled = false;
  }
});

function renderCard(item) {
  const card = document.createElement('div');
  card.className = 'card';

  const thumbWrap = document.createElement('div');
  thumbWrap.className = 'thumb-wrap';
  const img = document.createElement('img');
  img.src = item.thumbnail;
  img.alt = '';
  img.loading = 'lazy';
  thumbWrap.appendChild(img);
  if (item.duration != null) {
    const dur = document.createElement('span');
    dur.className = 'duration';
    dur.textContent = formatDuration(item.duration);
    thumbWrap.appendChild(dur);
  }

  const info = document.createElement('div');
  info.className = 'info';
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = item.title;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = [item.channel, formatViews(item.view_count)]
    .filter(Boolean).join(' · ');
  info.append(title, meta);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const pvBtn = document.createElement('button');
  pvBtn.className = 'pv-btn';
  pvBtn.textContent = '▶ 미리듣기';
  pvBtn.addEventListener('click', () => togglePreview(item, pvBtn, card));

  const dlBtn = document.createElement('button');
  dlBtn.className = 'dl-btn';
  dlBtn.textContent = 'MP3 다운로드';
  dlBtn.addEventListener('click', () => downloadAudio(item, dlBtn));

  actions.append(pvBtn, dlBtn);
  card.append(thumbWrap, info, actions);
  resultsEl.appendChild(card);
}

let activePlayer = null; // { audio, btn, row } - 동시에 하나만 재생

function stopPreview() {
  if (!activePlayer) return;
  const { audio, btn, row } = activePlayer;
  activePlayer = null;
  audio.pause();
  audio.removeAttribute('src');
  row.remove();
  btn.textContent = '▶ 미리듣기';
  btn.classList.remove('playing');
}

function togglePreview(item, btn, card) {
  const wasActive = activePlayer && activePlayer.btn === btn;
  stopPreview();
  if (wasActive) return;

  const row = document.createElement('div');
  row.className = 'player-row';
  const audio = document.createElement('audio');
  audio.controls = true;
  audio.autoplay = true;
  audio.preload = 'auto';
  audio.src = `/api/preview/${encodeURIComponent(item.id)}`;
  audio.addEventListener('error', () => {
    if (activePlayer && activePlayer.audio === audio) {
      setStatus('미리듣기를 불러오지 못했습니다. 잠시 후 다시 시도하세요.', true);
      stopPreview();
    }
  });
  row.appendChild(audio);
  card.appendChild(row);

  btn.textContent = '■ 중지';
  btn.classList.add('playing');
  activePlayer = { audio, btn, row };
}

async function downloadAudio(item, btn) {
  btn.disabled = true;
  btn.classList.remove('done');
  btn.textContent = '등록 중...';
  try {
    const res = await fetch(`/api/download/${encodeURIComponent(item.id)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: item.title }),
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) throw new Error(data.error || '다운로드 등록에 실패했습니다.');
    btn.textContent = data.duplicate ? '이미 진행 중' : '다운로드 시작 ✓';
    btn.classList.add('done');
    setStatus("백그라운드에서 다운로드합니다. '다운로드' 탭에서 진행 상황을 확인하세요.");
    pollJobs();
  } catch (err) {
    setStatus(err.message, true);
    btn.textContent = '다시 시도';
    btn.disabled = false;
  }
}

// ---------------------------------------------------------------------------
// 탭 전환 + 다운로드 현황 폴링
// ---------------------------------------------------------------------------

const tabSearch = document.getElementById('tabSearch');
const tabDownloads = document.getElementById('tabDownloads');
const searchView = document.getElementById('searchView');
const downloadsView = document.getElementById('downloadsView');
const dlBadge = document.getElementById('dlBadge');
const jobListEl = document.getElementById('jobList');
const fileListEl = document.getElementById('fileList');
const folderPathEl = document.getElementById('folderPath');

const tabFiles = document.getElementById('tabFiles');
const filesView = document.getElementById('filesView');

function switchTab(name) {
  tabSearch.classList.toggle('active', name === 'search');
  tabDownloads.classList.toggle('active', name === 'downloads');
  tabFiles.classList.toggle('active', name === 'files');
  searchView.hidden = name !== 'search';
  downloadsView.hidden = name !== 'downloads';
  filesView.hidden = name !== 'files';
  if (name === 'downloads') pollJobs();
  if (name === 'files') loadFiles();
}
tabSearch.addEventListener('click', () => switchTab('search'));
tabDownloads.addEventListener('click', () => switchTab('downloads'));
tabFiles.addEventListener('click', () => switchTab('files'));

function formatBytes(n) {
  if (n == null) return '?';
  if (n >= 1024 * 1024 * 1024) return (n / (1024 ** 3)).toFixed(2) + ' GB';
  if (n >= 1024 * 1024) return (n / (1024 ** 2)).toFixed(1) + ' MB';
  if (n >= 1024) return (n / 1024).toFixed(0) + ' KB';
  return n + ' B';
}

const JOB_STATE_LABEL = {
  queued: '대기 중',
  downloading: '다운로드 중',
  converting: 'MP3 변환 중',
  retrying: '재시도 중',
  done: '완료',
  error: '실패',
};

async function retryJob(jobId, btn) {
  btn.disabled = true;
  btn.textContent = '재시도 중...';
  try {
    const res = await fetch(`/api/jobs/${encodeURIComponent(jobId)}/retry`, { method: 'POST' });
    if (!res.ok) throw new Error('재시도 요청에 실패했습니다.');
    pollJobs();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = '재시도';
  }
}

function renderJobs(jobs) {
  jobListEl.innerHTML = '';
  if (!jobs.length) {
    jobListEl.innerHTML = '<div class="empty-note">진행 중인 다운로드가 없습니다.</div>';
    return;
  }
  jobs.forEach((job) => {
    const card = document.createElement('div');
    card.className = 'job-card';

    const title = document.createElement('div');
    title.className = 'job-title';
    title.textContent = job.filename || job.title;
    card.appendChild(title);

    if (['downloading', 'converting', 'queued', 'retrying'].includes(job.status)) {
      const bar = document.createElement('div');
      bar.className = 'progress';
      const fill = document.createElement('div');
      const pct = job.total_bytes
        ? Math.min(100, (job.downloaded_bytes / job.total_bytes) * 100) : null;
      if (job.status === 'downloading' && pct != null) {
        fill.style.width = pct.toFixed(1) + '%';
      } else {
        bar.classList.add('indeterminate');
      }
      bar.appendChild(fill);
      card.appendChild(bar);
    }

    const meta = document.createElement('div');
    meta.className = 'job-meta';
    const state = document.createElement('span');
    state.className = `job-state ${job.status}`;
    let label = JOB_STATE_LABEL[job.status] || job.status;
    if (job.status === 'retrying' && job.attempt) {
      label += ` (${job.attempt}/${job.max_attempts})`;
    }
    state.textContent = label;
    meta.appendChild(state);

    const detail = document.createElement('span');
    if (job.status === 'downloading') {
      const pct = job.total_bytes
        ? ` (${((job.downloaded_bytes / job.total_bytes) * 100).toFixed(0)}%)` : '';
      const speed = job.speed ? ` · ${formatBytes(job.speed)}/s` : '';
      detail.textContent =
        `${formatBytes(job.downloaded_bytes)} / ${formatBytes(job.total_bytes)}${pct}${speed}`;
    } else if (job.status === 'done') {
      detail.textContent = formatBytes(job.total_bytes);
    }
    meta.appendChild(detail);
    card.appendChild(meta);

    if (job.status === 'error') {
      if (job.error) {
        const err = document.createElement('div');
        err.className = 'job-error';
        err.textContent = job.error;
        card.appendChild(err);
      }
      const retry = document.createElement('button');
      retry.className = 'retry-btn';
      retry.textContent = '재시도';
      retry.addEventListener('click', () => retryJob(job.id, retry));
      card.appendChild(retry);
    }
    jobListEl.appendChild(card);
  });
}

function renderFiles(files) {
  fileListEl.innerHTML = '';
  if (!files.length) {
    fileListEl.innerHTML = '<div class="empty-note">저장된 파일이 없습니다.</div>';
    return;
  }
  files.forEach((f) => {
    const row = document.createElement('div');
    row.className = 'file-row';
    const name = document.createElement('span');
    name.className = 'file-name';
    name.textContent = f.name;
    const meta = document.createElement('span');
    meta.className = 'file-meta';
    const when = new Date(f.mtime * 1000).toLocaleString('ko-KR', {
      month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit',
    });
    meta.textContent = `${formatBytes(f.size)} · ${when}`;
    row.append(name, meta);
    fileListEl.appendChild(row);
  });
}

// ---------------------------------------------------------------------------
// 파일 탐색기 탭
// ---------------------------------------------------------------------------

const crumbsEl = document.getElementById('crumbs');
const explorerListEl = document.getElementById('explorerList');
const explorerSummaryEl = document.getElementById('explorerSummary');
const fileFilterEl = document.getElementById('fileFilter');
const sortSelectEl = document.getElementById('sortSelect');
const stickyPlayer = document.getElementById('stickyPlayer');
const spAudio = document.getElementById('spAudio');
const spTitle = document.getElementById('spTitle');

let allFiles = [];
let playingName = null;

function renderCrumbs(folder) {
  crumbsEl.innerHTML = '';
  // 안드로이드 Download 폴더는 탐색기에서 보이는 이름으로 바꿔 표시
  const friendly = folder.replace(
    /^(\/data\/data\/com\.termux\/files\/home\/storage\/downloads|\/storage\/emulated\/0\/Download)/,
    '내장 저장공간/Download');
  friendly.split('/').filter(Boolean).forEach((seg, i, arr) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '›';
      crumbsEl.appendChild(sep);
    }
    const s = document.createElement('span');
    s.className = 'seg';
    s.textContent = seg;
    crumbsEl.appendChild(s);
  });
  const full = document.createElement('span');
  full.className = 'full';
  full.textContent = folder;
  crumbsEl.appendChild(full);
}

function sortedFiles() {
  const [key, dir] = sortSelectEl.value.split('-');
  const q = fileFilterEl.value.trim().toLowerCase();
  const list = allFiles.filter((f) => !q || f.name.toLowerCase().includes(q));
  list.sort((a, b) => {
    let cmp;
    if (key === 'name') cmp = a.name.localeCompare(b.name, 'ko');
    else cmp = a[key] - b[key];
    return dir === 'asc' ? cmp : -cmp;
  });
  return list;
}

function renderExplorer() {
  const list = sortedFiles();
  explorerListEl.innerHTML = '';
  if (!list.length) {
    explorerListEl.innerHTML = allFiles.length
      ? '<div class="empty-note">검색 결과가 없습니다.</div>'
      : '<div class="empty-note">저장된 파일이 없습니다.</div>';
    return;
  }
  list.forEach((f) => {
    const row = document.createElement('div');
    row.className = 'ex-row' + (f.name === playingName ? ' playing' : '');

    const name = document.createElement('div');
    name.className = 'ex-name col-name';
    const ico = document.createElement('span');
    ico.className = 'ico';
    ico.textContent = '🎵';
    const txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = f.name;
    txt.title = f.name;
    name.append(ico, txt);

    const size = document.createElement('div');
    size.className = 'col-size';
    size.textContent = formatBytes(f.size);

    const date = document.createElement('div');
    date.className = 'col-date';
    date.textContent = new Date(f.mtime * 1000).toLocaleString('ko-KR', {
      year: '2-digit', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit',
    });

    const act = document.createElement('div');
    act.className = 'col-act';

    const play = document.createElement('button');
    play.className = 'icon-btn';
    play.title = '재생';
    play.textContent = f.name === playingName ? '⏸' : '▶';
    play.addEventListener('click', () => playFile(f.name));

    const save = document.createElement('a');
    save.className = 'icon-btn';
    save.title = '이 기기로 저장';
    save.textContent = '⬇';
    save.href = `/api/files/${encodeURIComponent(f.name)}?download=1`;
    save.setAttribute('download', f.name);
    save.style.display = 'inline-flex';
    save.style.alignItems = 'center';
    save.style.justifyContent = 'center';
    save.style.textDecoration = 'none';

    const del = document.createElement('button');
    del.className = 'icon-btn danger';
    del.title = '삭제';
    del.textContent = '🗑';
    del.addEventListener('click', () => deleteFile(f.name));

    act.append(play, save, del);
    row.append(name, size, date, act);
    explorerListEl.appendChild(row);
  });
}

function playFile(name) {
  if (playingName === name && !spAudio.paused) {
    spAudio.pause();
    renderExplorer();
    return;
  }
  playingName = name;
  spTitle.textContent = name;
  spAudio.src = `/api/files/${encodeURIComponent(name)}`;
  spAudio.play().catch(() => {});
  stickyPlayer.hidden = false;
  document.body.classList.add('player-open');
  renderExplorer();
}

document.getElementById('spClose').addEventListener('click', () => {
  spAudio.pause();
  spAudio.removeAttribute('src');
  stickyPlayer.hidden = true;
  document.body.classList.remove('player-open');
  playingName = null;
  renderExplorer();
});
spAudio.addEventListener('play', renderExplorer);
spAudio.addEventListener('pause', renderExplorer);

async function deleteFile(name) {
  if (!confirm(`삭제할까요?\n\n${name}`)) return;
  try {
    const res = await fetch(`/api/files/${encodeURIComponent(name)}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('삭제에 실패했습니다.');
    if (playingName === name) {
      spAudio.pause();
      stickyPlayer.hidden = true;
      document.body.classList.remove('player-open');
      playingName = null;
    }
    loadFiles();
  } catch (err) {
    alert(err.message);
  }
}

async function loadFiles() {
  try {
    const res = await fetch('/api/files');
    if (!res.ok) return;
    const data = await res.json();
    allFiles = data.files;
    renderCrumbs(data.folder);
    explorerSummaryEl.textContent =
      `파일 ${data.count}개 · 총 ${formatBytes(data.total_size)}`;
    renderExplorer();
  } catch (_) { /* 네트워크 오류는 조용히 무시 */ }
}

fileFilterEl.addEventListener('input', renderExplorer);
sortSelectEl.addEventListener('change', renderExplorer);
document.getElementById('refreshFiles').addEventListener('click', loadFiles);
document.querySelectorAll('.ex-head span[data-sort]').forEach((el) => {
  el.addEventListener('click', () => {
    const key = el.dataset.sort;
    const [curKey, curDir] = sortSelectEl.value.split('-');
    const dir = curKey === key && curDir === 'asc' ? 'desc' : 'asc';
    sortSelectEl.value = `${key}-${dir}`;
    renderExplorer();
  });
});

let pollTimer = null;
let prevActive = 0;

async function pollJobs() {
  try {
    const res = await fetch('/api/jobs');
    if (!res.ok) return;
    const data = await res.json();

    if (data.active > 0) {
      dlBadge.textContent = data.active;
      dlBadge.hidden = false;
    } else {
      dlBadge.hidden = true;
    }
    // 다운로드가 막 끝났으면 파일 목록을 새로 불러온다
    if (prevActive > 0 && data.active === 0 && !filesView.hidden) loadFiles();
    prevActive = data.active;
    if (!downloadsView.hidden) {
      folderPathEl.textContent = `저장 폴더: ${data.folder}`;
      renderJobs(data.jobs);
      renderFiles(data.files);
    }
    // 활성 작업이 있거나 다운로드 탭을 보는 중이면 빠르게, 아니면 느리게 폴링
    scheduleNextPoll(data.active > 0 || !downloadsView.hidden ? 1000 : 5000);
  } catch (_) {
    scheduleNextPoll(5000);
  }
}

function scheduleNextPoll(delay) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(pollJobs, delay);
}

pollJobs();
</script>

</html>
